kind = "web"
previewPath = "/"
title = "Padel Tracker IA"
version = "1.0.0"
id = "artifacts/padel-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21895

[services.development]
run = "pnpm --filter @workspace/padel-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/padel-tracker", "run", "build" ]
publicDir = "artifacts/padel-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21895"
BASE_PATH = "/"
